# ============================================================
# Divine World Project - Global AI Configuration
# ============================================================
runtime:
  device_preference: auto        # "cuda", "cpu", or "auto"
  precision: bfloat16            # float32 | float16 | bfloat16
  allow_mixed_precision: true
  safe_mode: true
  log_level: INFO
  log_format: "[%(asctime)s][%(levelname)s] %(name)s: %(message)s"
  max_context_tokens: 4096
  random_seed: 42

world_model:
  model_name: divine_world_dreamer_v1
  latent_dim: 256
  hidden_dim: 512
  horizon: 16
  rollout_batch_size: 8
  max_replay_size: 200000
  learning_rate: 0.0003
  imagine_temperature: 0.9
  device_override: null
  save_path: data/models/world_model/

language_model:
  model_name_or_path: gpt2
  revision: main
  trust_remote_code: false
  enable_lora: true
  lora_r: 8
  lora_alpha: 32
  lora_dropout: 0.05
  max_new_tokens: 256
  temperature: 0.8
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.05
  allow_world_model_grounding: true
  grounding_rollouts: 4
  save_path: data/models/transformer_lm/

training:
  batch_size: 16
  epochs: 3
  lr: 5e-5
  world_model_update_freq: 50
  language_model_update_freq: 100
  checkpoint_interval: 200
  log_interval: 10
  save_dir: data/checkpoints/

paths:
  brains_dir: data/brains/
  datasets_dir: data/datasets/
  logs_dir: data/logs/
  temporary_dir: data/tmp/

# ============================================================
# Environment Variables Supported (prefix DW_)
# ============================================================
# DW_DEVICE         -> override runtime.device_preference
# DW_PRECISION      -> override runtime.precision
# DW_LM             -> override language_model.model_name_or_path
# DW_WM             -> override world_model.model_name
# DW_LOG_LEVEL      -> override runtime.log_level
# DW_LOG_DIR        -> override paths.logs_dir
# DW_SAFE_MODE      -> override runtime.safe_mode
# ============================================================
