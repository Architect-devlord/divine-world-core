plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'         // ForgeGradle
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

group = 'com.divineworld'
version = '1.0.0'
archivesBaseName = 'divineworld'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.minecraftforge.net/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:1.21.8-58.1.6"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}

minecraft {
    mappings channel: 'parchment', version: '2025.09.14-1.21.8'
    runs {
        server {
            workingDirectory project.file('run-server')
            property 'forge.logging.console.level', 'info'
        }
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title': 'DivineWorld',
            'Specification-Version': '1.0.0',
            'Implementation-Title': project.name,
            'Implementation-Version': project.version
        ])
    }
}
tasks.register("printMappings") {
    doLast {
        println "Mappings: ${minecraft.mappings}"
    }
}
